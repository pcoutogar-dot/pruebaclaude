<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Planeadora: Amigos de verano. Una noche en la ría, una planeadora, tres fardos por viaje y la lancha de Aduanas detrás. Minijuego en el navegador.">
<meta name="theme-color" content="#050c12">
<meta property="og:title" content="Planeadora: Amigos de verano">
<meta property="og:description" content="Una noche en la ría, una planeadora y la lancha de Aduanas detrás. ¿Llegas a tierra antes de que amanezca?">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='30' r='22' fill='%23ff8a3d'/%3E%3Cpath d='M6 40h52l-8 10H16z' fill='%2314080f'/%3E%3Crect x='28' y='32' width='8' height='8' fill='%2314080f'/%3E%3C/svg%3E">
<title>Planeadora: Amigos de verano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600;700&family=Caveat:wght@600&family=Yellowtail&display=swap">
<style>
/* Layout: canvas a pantalla completa; HUD en las esquinas como instrumentos de a bordo, luz de sodio sobre noche atlántica */
:root{
  --night:#050c12;
  --ink:#e6edf0;
  --dim:#8aa0ab;
  --sodium:#ffb341;
  --alert:#ff4b3a;
  --radio:#9fe3c4;
  --panel:rgba(5,12,18,.66);
  --line:rgba(230,237,240,.16);
  --display:'Anton', Impact, 'Arial Narrow', sans-serif;
  --body:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --hand:'Caveat', 'Comic Sans MS', cursive;
  --paper:#f3efe4;
  --stamp:#ff8a2a;
  color-scheme:dark;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block}
[hidden]{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none;font-variant-numeric:tabular-nums}
.lab{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
#tl{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:6px}
#tl .row{display:flex;align-items:baseline;gap:10px}
#tl .big{font-family:var(--display);font-size:30px;line-height:1}
#tl .sm{font-size:18px;color:var(--dim)}
#slots{display:flex;gap:3px;margin-top:2px}
#slots i{width:26px;height:14px;border:1px solid var(--line);background:transparent;display:block}
#slots i.on{background:var(--sodium);border-color:var(--sodium)}
#tc{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center}
#timer{font-family:var(--display);font-size:46px;line-height:1;letter-spacing:.02em}
#timer.hurry{color:var(--alert);animation:pulse .5s infinite alternate}
@keyframes pulse{to{opacity:.55}}
#tr{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));text-align:right;display:grid;gap:6px;justify-items:end}
#mm{width:210px;height:137px;display:block;border:1px solid var(--line);background:#0b1820;box-shadow:0 6px 20px rgba(0,0,0,.45)}
#riskbar{width:210px;height:8px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
#riskfill{height:100%;width:0;background:var(--sodium);transition:background .2s}
#riskfill.hot{background:var(--alert)}
#risktxt{font-size:16px;color:var(--dim)}
#risktxt.hot{color:var(--alert);font-weight:700}
#bl{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;gap:14px;align-items:flex-end}
#spd{font-family:var(--display);font-size:56px;line-height:.9}
#spd small{font-family:var(--body);font-size:16px;color:var(--dim);letter-spacing:.12em;margin-left:4px}
.gauge{display:grid;gap:4px}
#thr{position:relative;width:14px;height:86px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
#thrfill{position:absolute;left:0;right:0;background:var(--sodium)}
#thrtgt{position:absolute;left:-5px;right:-5px;height:2px;background:var(--ink)}
#thr::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
#rud{position:relative;width:110px;height:12px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
#rudfill{position:absolute;top:0;bottom:0;background:var(--sodium)}
#rudtgt{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
#rud::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--line)}
#obj{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);text-align:center;max-width:min(520px,60vw)}
#objtxt{font-size:22px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
#prog{width:240px;height:6px;margin:8px auto 0;background:rgba(255,255,255,.08);border:1px solid var(--line);visibility:hidden}
#progfill{height:100%;width:0;background:var(--sodium)}
#msg{position:absolute;top:36%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(28px,5vw,54px);text-align:center;text-shadow:0 2px 18px rgba(0,0,0,.8);opacity:0;transition:opacity .25s;white-space:nowrap}
#msg.show{opacity:1}
#msg.bad{color:var(--alert)}
#msg.good{color:var(--sodium)}
#radio{position:absolute;top:calc(92px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-size:19px;color:var(--radio);background:var(--panel);padding:6px 14px;border-left:3px solid var(--radio);opacity:0;transition:opacity .3s;max-width:min(560px,86vw)}
#radio.show{opacity:1}
#ptr{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
#ptrarrow{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:20px solid var(--sodium);filter:drop-shadow(0 0 6px rgba(255,179,65,.6))}
#ptrlab{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sodium);text-shadow:0 1px 4px #000;white-space:nowrap}
#overlay{position:fixed;inset:0;display:flex;overflow-y:auto;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(5,12,18,.55),rgba(5,12,18,.92));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#card{max-width:560px;width:100%;display:grid;gap:14px;margin:auto;padding-block:24px}
#card h1{font-family:var(--display);font-weight:400;font-size:clamp(54px,12vw,104px);line-height:.9;margin:0;letter-spacing:.01em;color:var(--ink);text-wrap:balance}
#card h1 span{color:var(--sodium)}
#card .kick{font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:var(--sodium);font-weight:700}
#card p{font-size:20px;line-height:1.35;margin:0;color:var(--ink);max-width:62ch}
#card .keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:18px;color:var(--dim)}
#card .keys b{color:var(--ink);font-weight:700}
#card .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#card .stats div{border-top:1px solid var(--line);padding-top:6px}
#card .stats strong{display:block;font-family:var(--display);font-weight:400;font-size:34px}
#go,.btn{justify-self:start;font-family:var(--display);font-size:24px;letter-spacing:.06em;background:var(--sodium);color:#1b1206;border:0;padding:12px 26px;cursor:pointer;pointer-events:auto}
#go:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#touch{position:fixed;inset:auto 0 0 0;display:none;justify-content:space-between;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
#touch .pad{display:flex;gap:12px;pointer-events:auto}
#touch .pad.v{flex-direction:column}
#touch button{width:68px;height:68px;border-radius:50%;border:1px solid var(--line);background:rgba(5,12,18,.5);color:var(--ink);font-size:26px;touch-action:none}
#touch button.on{background:rgba(255,179,65,.35)}
body.touch #touch{display:flex}
body.touch #bl{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (max-width:640px){#tl .big{font-size:24px}#timer{font-size:36px}#spd{font-size:42px}#riskbar{width:140px}#mm{width:140px;height:91px}#objtxt{font-size:17px}#card p{font-size:18px}}

/* ---------- pantalla de carga: copias de revelado de verano en la ría ---------- */
#loader{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%,#1a2129 0%,#070c11 70%);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .7s ease}
#loader.out{opacity:0;pointer-events:none}
.lwrap{width:min(980px,100%);display:grid;gap:18px;justify-items:center}
.prints{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%}
.print{background:var(--paper);padding:10px 10px 34px;box-shadow:0 18px 40px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);position:relative;min-width:0}
.print:first-child{transform:rotate(-2.2deg) translateY(6px)}
.print:last-child{transform:rotate(1.6deg)}
.print svg{display:block;width:100%;height:auto;filter:saturate(.82) contrast(.95) sepia(.18)}
.print figcaption{position:absolute;left:14px;bottom:5px;font-family:var(--hand);font-size:22px;color:#3a4250}
.print .stamp{position:absolute;right:20px;bottom:44px;font:700 15px/1 'Courier New',monospace;color:var(--stamp);text-shadow:0 0 4px rgba(255,120,30,.8);letter-spacing:.08em}
.ltitle{font-family:var(--display);font-weight:400;font-size:clamp(46px,9vw,92px);line-height:.9;margin:6px 0 0;letter-spacing:.01em}
.ltitle span{color:var(--sodium)}
.lbar{width:min(420px,100%);height:6px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
#lfill{height:100%;width:4%;background:var(--sodium);transition:width .25s}
.lrow{width:min(420px,100%);display:flex;justify-content:space-between;font-size:16px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}
#ltip{margin:0;font-size:19px;color:var(--ink);opacity:.85;text-align:center;max-width:52ch;min-height:2.6em}
@media (max-width:640px){.prints{grid-template-columns:1fr;gap:10px}.print:last-child{display:none}}
/* ---------- menú e instrucciones ---------- */
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{font-family:var(--display);font-size:22px;letter-spacing:.06em;border:0;padding:12px 26px;cursor:pointer;pointer-events:auto}
.btn.pri{background:var(--sodium);color:#1b1206}
.btn.sec{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.help{display:grid;grid-template-columns:1fr 1fr;gap:16px 26px}
.help section{border-top:1px solid var(--line);padding-top:8px;min-width:0}
.help h3{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.04em;color:var(--sodium)}
.help p,.help li{font-size:17px;line-height:1.35;color:var(--ink)}
.help ul{margin:0;padding-left:18px}
.help .keys{font-size:17px}
#card.wide{max-width:780px}
@media (max-width:640px){.help{grid-template-columns:1fr}}

/* ---------- logotipo: titular de videojuego de los 90, atardecer de neón ---------- */
.logo{--stripe:#070c11;position:relative;display:inline-grid;justify-items:center;padding:.12em .25em .5em;font-size:clamp(44px,10vw,104px);line-height:.92;isolation:isolate;user-select:none}
.logo-sun{position:absolute;left:50%;top:44%;width:1.75em;height:1.75em;transform:translate(-50%,-50%);border-radius:50%;z-index:-1;
  background:linear-gradient(#ffe08a 0%,#ff9a3c 42%,#f0436a 72%,#7c1f72 100%);box-shadow:0 0 .6em rgba(255,90,90,.35);overflow:hidden}
.logo-sun::after{content:"";position:absolute;inset:52% 0 0;background:repeating-linear-gradient(180deg,transparent 0 .07em,var(--stripe) .07em .13em)}
.logo-main{font-family:var(--display);letter-spacing:.015em;transform:skewX(-8deg);
  background:linear-gradient(180deg,#fffbe8 0%,#ffd76e 36%,#ff8c3a 62%,#e0324f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:.03em #14080f;paint-order:stroke fill;filter:drop-shadow(.035em .055em 0 #14080f) drop-shadow(0 0 .22em rgba(255,110,60,.45))}
.logo-sub{font-family:'Yellowtail','Brush Script MT',cursive;font-size:.46em;color:#ffe6fa;transform:rotate(-7deg);margin:-.42em 0 0 1.1em;white-space:nowrap;
  text-shadow:0 0 .05em #fff,0 0 .18em #ff3fc4,0 0 .45em #ff3fc4,0 0 .9em rgba(255,63,196,.6),.04em .06em 0 #14080f}
.logo.sm{font-size:clamp(34px,6vw,58px)}
/* ---------- frases de la tripulación ---------- */
#shout{position:absolute;top:calc(142px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%) translateY(6px);display:flex;gap:10px;align-items:baseline;
  background:var(--panel);padding:7px 16px;opacity:0;transition:opacity .25s,transform .25s;font-size:22px;font-weight:600;max-width:min(620px,88vw)}
#shout.show{opacity:1;transform:translateX(-50%)}
#shout b{font-size:13px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
@media (prefers-reduced-motion:reduce){#timer.hurry{animation:none}}
</style>
</head>

          <defs>
            <linearGradient id="sk2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ea7cf"/><stop offset="1" stop-color="#c8d9e3"/></linearGradient>

            <path d="M0 0L-62 -20M0 0L62 -20M0 0V56" stroke="#3a3f44" stroke-width="9"/>
            <circle r="15" fill="#9aa1a6"/>
          </g>
          <path d="M300 214 V160" stroke="#c4c8ca" stroke-width="7"/><rect x="290" y="146" width="22" height="18" rx="4" fill="#202326"/>

/* =========================================================
   NOISE + TERRENO (función analítica compartida por malla, agua y colisiones)
   ========================================================= */
function hash(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y){return vnoise(x,y)*.55+vnoise(x*2.03+5.2,y*2.03+1.3)*.3+vnoise(x*4.1+9.1,y*4.1+3.7)*.15;}
const G=(x,c,w)=>{const t=(x-c)/w;return Math.exp(-t*t);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const wrapA=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;};

const BEACH_X=120, PORT_X=-150;
// La tierra queda al norte (z menor). El mar, al sur (z mayor).
function coastZ(x){
  return -200 + 18*Math.sin(x*.011+.5) + 9*Math.sin(x*.027+2) + 4*Math.sin(x*.07)
    + 55*G(x,-330,40) + 35*G(x,380,45) - 55*G(x,BEACH_X,42) - 42*G(x,PORT_X,30);
}
function terrainInfo(x,z){
  const c=coastZ(x), d=c-z;
  const beach=G(x,BEACH_X,40), port=G(x,PORT_X,32);
  const rock=1-Math.max(beach,port*.7);
  const reefN=fbm(x*.045+3,z*.045+7);
  const reef=rock*Math.max(0,reefN-.55)*13;
  let h;
  if(d<0){
    h=Math.max(-14,d*(.1-.05*beach)) + reef*Math.exp(d/28);
  }else{
    const hill=7+30*fbm(x*.005+11,z*.005+2);
    h=Math.min(d*(.07+.4*rock),hill);
    h+=rock*(fbm(x*.05,z*.05)-.45)*6*Math.min(1,d/6+.3);
    h+=reef*Math.exp(-d/28);
  }
  return {h,d,beach,port,rock};
}
const terrainH=(x,z)=>terrainInfo(x,z).h;

  const p=parts[partIdx];partIdx=(partIdx+1)%WAKE_N;

  const col=wakeMesh.instanceColor.array;

    p.life-=dt;p.x+=p.vx*dt;p.z+=p.vz*dt;p.vx*=1-dt*1.5;p.vz*=1-dt*1.5;p.size+=p.grow*dt;
    const t=p.life/p.max,a=p.int*Math.pow(Math.max(t,0),1.4);

    wakeMesh.setMatrixAt(i,_d.matrix);col[i*3]=a*.8;col[i*3+1]=a*.88;col[i*3+2]=a*.95;

let AU=null,muted=false;
function initAudio(){
  if(AU)return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);
    const o1=ctx.createOscillator();o1.type='sawtooth';
    const o2=ctx.createOscillator();o2.type='square';
    const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=400;f.Q.value=3;
    const g=ctx.createGain();g.gain.value=0;
    o1.connect(f);o2.connect(f);f.connect(g);g.connect(master);o1.start();o2.start();
    const buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const n=ctx.createBufferSource();n.buffer=buf;n.loop=true;
    const nf=ctx.createBiquadFilter();nf.type='bandpass';nf.frequency.value=700;nf.Q.value=.6;
    const ng=ctx.createGain();ng.gain.value=0;n.connect(nf);nf.connect(ng);ng.connect(master);n.start();
    const so=ctx.createOscillator();so.type='triangle';const sg=ctx.createGain();sg.gain.value=0;so.connect(sg);sg.connect(master);so.start();
    AU={ctx,master,o1,o2,f,g,ng,nf,so,sg};
  }catch(e){AU=null;}
}
function beep(freq,dur=.08,vol=.12,type='square'){
  if(!AU||muted)return;const t=AU.ctx.currentTime,o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
  o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+dur+.02);
}
function thud(){
  if(!AU||muted)return;const t=AU.ctx.currentTime,o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
  o.type='sine';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(35,t+.3);
  g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+.4);
}

  // radar: la patrullera solo aparece cerca o cuando te persigue
  const RAD=260,pd=Math.hypot(patrol.x-S.x,patrol.z-S.z);
  mctx.strokeStyle='rgba(159,227,196,.25)';mctx.lineWidth=1;mctx.beginPath();mctx.arc(mx(S.x),my(S.z),RAD/(MM.x1-MM.x0)*mmW,0,7);mctx.stroke();
  if(pd<RAD||patrol.state==='chase'){
    const ang=patrol.h+patrol.sweep;
    mctx.fillStyle='rgba(255,238,194,.25)';mctx.beginPath();mctx.moveTo(mx(patrol.x),my(patrol.z));
    mctx.arc(mx(patrol.x),my(patrol.z),78/(MM.x1-MM.x0)*mmW,Math.PI/2-ang-.3,Math.PI/2-ang+.3);mctx.fill();
    mctx.fillStyle=patrol.state==='chase'&&Math.sin(t*14)>0?'#3a7bff':'#ff4b3a';mctx.beginPath();mctx.arc(mx(patrol.x),my(patrol.z),2.6,0,7);mctx.fill();
  }
  // nuestra planeadora
  mctx.save();mctx.translate(mx(S.x),my(S.z));mctx.rotate(-S.h);
  mctx.fillStyle='#ffb341';mctx.strokeStyle='#1b1206';mctx.lineWidth=1;mctx.beginPath();mctx.moveTo(0,6);mctx.lineTo(3.6,-4);mctx.lineTo(0,-2.2);mctx.lineTo(-3.6,-4);mctx.closePath();mctx.fill();mctx.stroke();
  mctx.restore();
}

/* =========================================================
   FÍSICA DE LA PLANEADORA
   ========================================================= */
const BOAT_CIRCLES=[[0,4.2,1.4],[0,0,1.6],[0,-4.4,1.6]];
function stepBoat(dt,inp){
  // retardo de órdenes: el gas y el timón llegan con inercia
  S.thr+=clamp(inp.thr-S.thr,-dt*1.15,dt*1.15);
  S.rud+=clamp(inp.steer-S.rud,-dt*2.6,dt*2.6);
  const fx=Math.sin(S.h),fz=Math.cos(S.h),rx=-Math.cos(S.h),rz=Math.sin(S.h);
  let u=S.vx*fx+S.vz*fz,w=S.vx*rx+S.vz*rz;
  const load=1-.08*S.cargo;
  const thrust=S.thr>=0?S.thr*9*load:S.thr*4.2;
  let au=thrust-.0156*u*Math.abs(u)-.16*u-Math.abs(S.om)*Math.abs(u)*.1;
  const aw=-w*(1.35+.02*Math.abs(u));               // poco agarre lateral -> derrape
  u+=au*dt;w+=aw*dt;
  // giro: depende de la velocidad del agua sobre el casco y del empuje vectorizado de los fueraborda
  const alpha=-S.rud*(u*.062+S.thr*.75)-S.om*2.2;
  S.om+=alpha*dt;S.h+=S.om*dt;
  S.vx=fx*u+rx*w;S.vz=fz*u+rz*w;
  S.x+=S.vx*dt;S.z+=S.vz*dt;
  S.u=u;S.w=w;S.au=au;
  collideBoat();
}
function boatPoint(lx,lz){const fx=Math.sin(S.h),fz=Math.cos(S.h);return [S.x+fx*lz+Math.cos(S.h)*lx,S.z+fz*lz-Math.sin(S.h)*lx];}
function impact(speed,n){
  if(speed<4||S.hitCd>0)return;
  S.hitCd=1;S.hits++;S.shake=Math.min(1.2,speed/8);thud();
  if(speed>7.5&&S.cargo>0){
    S.cargo--;S.lost++;updateSlotsUI();
    const [px,pz]=boatPoint(0,-1);const m=fardoGrande();m.position.set(px,.3,pz);scene.add(m);sinking.push({m,t:0,vx:-n[0]*3+(Math.random()-.5)*2,vz:-n[1]*3+(Math.random()-.5)*2});
    say('¡Golpe! Fardo al agua','bad',1.6);talk('fardo','patron',3);
    if(S.stock+S.cargo+S.delivered+flying.length<CFG.goal)setTimeout(()=>endGame('short'),800);
  }else{say('¡Cuidado con las piedras!','bad',1.2);talk('golpe','patron',5);}
}
function collideBoat(){
  let maxImp=0,nI=[0,1];
  // costa y bajos (desde la función de terreno)
  const pts=[[0,6],[0,3],[0,0],[0,-3.5],[0,-6],[1.4,-4.5],[-1.4,-4.5],[1.3,2],[-1.3,2]];
  for(const [lx,lz] of pts){
    const [px,pz]=boatPoint(lx,lz),h=terrainH(px,pz);
    if(h>-.15){
      const gx=(terrainH(px+1,pz)-terrainH(px-1,pz))/2,gz=(terrainH(px,pz+1)-terrainH(px,pz-1))/2;
      let gl=Math.hypot(gx,gz),nx=-gx,nz=-gz;
      if(gl<1e-4){nx=0;nz=1;gl=1;}else{nx/=gl;nz/=gl;}
      const pen=Math.min(1.5,(h+.15)/Math.max(.25,gl));
      S.x+=nx*pen*.6;S.z+=nz*pen*.6;
      const vn=S.vx*nx+S.vz*nz;
      if(vn<0){S.vx-=1.35*vn*nx;S.vz-=1.35*vn*nz;if(-vn>maxImp){maxImp=-vn;nI=[nx,nz];}}
      S.vx*=.985;S.vz*=.985;S.om*=.9;
    }
  }
  // obstáculos circulares
  for(const [lx,lz,br] of BOAT_CIRCLES){
    const [px,pz]=boatPoint(lx,lz);
    for(const c of colliders){
      const dx=px-c.x,dz=pz-c.z,rr=c.r+br;
      if(Math.abs(dx)>rr||Math.abs(dz)>rr)continue;
      const d=Math.hypot(dx,dz);if(d>=rr||d<1e-4)continue;
      const nx=dx/d,nz=dz/d;S.x+=nx*(rr-d);S.z+=nz*(rr-d);
      const vn=S.vx*nx+S.vz*nz;
      if(vn<0){S.vx-=1.4*vn*nx;S.vz-=1.4*vn*nz;S.om+=(lz>0?1:-1)*vn*.04*Math.sign(nx*Math.cos(S.h)-nz*Math.sin(S.h)||1);if(-vn>maxImp){maxImp=-vn;nI=[nx,nz];}}
    }
  }
  if(maxImp>0)impact(maxImp,nI);
  // límites del mapa
  let out=false;
  if(S.x<-680){S.vx+=(-680-S.x)*.4;out=true;} if(S.x>680){S.vx-=(S.x-680)*.4;out=true;}
  if(S.z>580){S.vz-=(S.z-580)*.4;out=true;}
  if(out&&S.boundsMsgCd<=0){say('Demasiado lejos de la ría','',1.4);S.boundsMsgCd=3;}
}

/* =========================================================
   IA PATRULLERA
   ========================================================= */
function stepPatrol(dt,t){
  const P=patrol,dxp=S.x-P.x,dzp=S.z-P.z,dist=Math.hypot(dxp,dzp);
  let tx,tz;
  if(P.state==='chase'){
    // intercepta anticipando la posición
    const lead=Math.min(2.2,dist/18);tx=S.x+S.vx*lead;tz=S.z+S.vz*lead;
  }else{
    [tx,tz]=PATROL_WP[P.wp];
    if(Math.hypot(tx-P.x,tz-P.z)<30)P.wp=(P.wp+1)%PATROL_WP.length;
  }
  let desired=Math.atan2(tx-P.x,tz-P.z);
  // evita tierra
  const ax=P.x+Math.sin(P.h)*22,az=P.z+Math.cos(P.h)*22;
  if(terrainH(ax,az)>-1.8)desired=Math.atan2(0,1);
  for(const c of colliders){if(c.kind==='rock'&&c.r<4)continue;const d=Math.hypot(ax-c.x,az-c.z);if(d<c.r+6){desired=P.h+(((ax-c.x)*Math.cos(P.h)-(az-c.z)*Math.sin(P.h))>0?.9:-.9);break;}}
  const turn=P.state==='chase'?1.05:.55;
  P.h+=clamp(wrapA(desired-P.h),-turn*dt,turn*dt);
  const vt=P.state==='chase'?15.2:7.5;P.speed+=clamp(vt-P.speed,-dt*4,dt*2.5);
  P.x+=Math.sin(P.h)*P.speed*dt;P.z+=Math.cos(P.h)*P.speed*dt;
  // foco
  const rel=wrapA(Math.atan2(dxp,dzp)-P.h);
  if(P.state==='chase')P.sweep+=clamp(rel-P.sweep,-dt*2,dt*2);
  else P.sweep=Math.sin(t*.75)*.75;
  P.sweep=clamp(P.sweep,-1.3,1.3);
  const inCone=dist<76&&Math.abs(wrapA(rel-P.sweep))<.28;
  const near=dist<16;
  if(S.mode==='play'){
    if(inCone||near){S.risk+=dt*(.75+(1-dist/76)*1.4);}
    else S.risk-=dt*(P.state==='chase'?.1:.28);
    S.risk=clamp(S.risk,0,1);
    if(P.state!=='chase'&&S.risk>=1){P.state='chase';P.lost=0;say('¡ADUANAS! ¡Corre!','bad',2);radio('Radio: «Lancha de Aduanas enriba de vós! Fuxide!»',3.5);talk('chase','mate',6);}
    if(P.state==='chase'){
      if(dist>95&&!inCone)P.lost+=dt;else P.lost=Math.max(0,P.lost-dt*.5);
      if(P.lost>4.5){P.state='patrol';S.risk=.45;P.wp=nearestWp();say('Les has dado esquinazo','good',1.8);talk('lost','patron',6);}
      if(dist<9){S.vx*=.3;S.vz*=.3;endGame('caught');}
    }
  }
  // visual
  const pwb=waveY(P.x+Math.sin(P.h)*6,P.z+Math.cos(P.h)*6,t),pws=waveY(P.x-Math.sin(P.h)*6,P.z-Math.cos(P.h)*6,t);
  P.group.position.set(P.x,waveY(P.x,P.z,t)+.15,P.z);P.group.rotation.set(-.05*smooth(4,14,P.speed)-(pwb-pws)/12,P.h,0);
  patrol.spotT.position.set(Math.sin(P.sweep)*45,0,Math.cos(P.sweep)*45);
  patrol.spot.intensity=70*(1-.75*sky.day);patrol.light.material.uniforms.uO.value=.33*(1-.7*sky.day);
  patrol.bl.intensity=P.state==='chase'?(Math.sin(t*14)>0?40:0):0;
  P.light.rotation.y=P.sweep;
  P.blue.material.opacity=P.state==='chase'?(Math.sin(t*14)>0?1:.1):0;
  if(Math.random()<P.speed*.08){const bx=P.x-Math.sin(P.h)*7.5,bz=P.z-Math.cos(P.h)*7.5;
    emit(bx,bz,-Math.sin(P.h)*2,-Math.cos(P.h)*2,1.6,2.2,2.5,.3*Math.min(1,P.speed/8));}
  return dist;
}
function nearestWp(){let b=0,bd=1e9;PATROL_WP.forEach(([x,z],i)=>{const d=Math.hypot(x-patrol.x,z-patrol.z);if(d<bd){bd=d;b=i;}});return b;}

/* =========================================================
   CARGA / DESCARGA / OBJETIVOS

function stepMission(dt){
  const speed=Math.hypot(S.vx,S.vz);
  const dNod=Math.hypot(S.x-NOD.zx,S.z-NOD.zz);
  const inLoad=dNod<20&&S.cargo<CFG.capacity&&S.stock>0;
  const D=S.drop,inDrop=D&&S.cargo>0&&Math.hypot(S.x-D.x,S.z-D.z)<16;
  const slow=speed<CFG.maxLoadSpeed;
  let objective='',prog=-1;

  if(inLoad){
    if(slow){
      S.loadT+=dt;prog=S.loadT/CFG.loadEvery;
      if(S.loadT>=CFG.loadEvery&&S.pendingIn===0){
        S.loadT=0;S.stock--;S.pendingIn++;
        const slot=Math.min(S.cargo,CFG.capacity-1);
        flyBox({x:NOD.deckX,y:7,z:NOD.deckZ},()=>{const [px,pz]=boatPoint(0,boat.slotZ[slot]);return {x:px,y:1.5,z:pz};},.8,()=>{
          S.pendingIn--;if(S.mode!=='play')return;S.cargo++;beep(520+S.cargo*30,.06,.08);updateSlotsUI();
          if(S.cargo===1&&!S.drop){S.drop=DROPS[Math.random()<.5?0:1];S.drop.zone.visible=true;
            radio(S.drop===BEACH_DROP?'Radio: «Praia da Lagoa limpa. Alí vos agardamos co coche.»':'Radio: «Ide ao Peirao Vello. A garda civil está na praia.»',4.5);}
          if(S.cargo===1)talk('nodriza','nodriza',40);
          if(S.cargo>=CFG.capacity){say('¡Carga completa!','good',1.5);talk('full','mate',10,true);}
        });
        updateSlotsUI();
      }
      objective=`Cargando · ${S.cargo}/${CFG.capacity}`;
    }else objective='Frena para cargar';
  }else S.loadT=0;

  if(inDrop){
    if(slow){
      S.unloadT+=dt;prog=S.unloadT/CFG.unloadEvery;
      if(S.unloadT>=CFG.unloadEvery){
        S.unloadT=0;S.cargo--;updateSlotsUI();if(S.cargo===CFG.capacity-1)talk('terra','terra',20);
        const [px,pz]=boatPoint(0,-2);const dd=D;
        flyBox({x:px,y:1.5,z:pz},{x:dd.landX+(Math.random()-.5)*3,y:dd.landY,z:dd.landZ+(Math.random()-.5)*2},.6,()=>{
          if(S.mode!=='play')return;S.delivered++;ui.deliv.textContent=S.delivered;beep(880,.05,.07);
          if(S.delivered>=CFG.goal)endGame('win');
        });
        if(S.cargo===0){
          D.zone.visible=false;S.drop=null;
          if(S.delivered+1<CFG.goal){say('¡Descargado! Vuelve a la nodriza','good',1.8);talk('trip','patron',10,true);}
        }
      }
      objective=`Descargando · quedan ${S.cargo}`;
    }else objective='Frena para descargar';
  }else S.unloadT=0;

  // a dónde apuntar
  let target=null,label='';
  const goShore=S.cargo>0&&(S.cargo>=CFG.capacity||S.stock<=0||!inLoad);
  if(goShore&&S.drop){target={x:S.drop.x,z:S.drop.z};label=S.drop.name;if(!objective)objective=`Descarga en ${S.drop.name}`;}
  else if(S.stock>0){target={x:NOD.zx,z:NOD.zz};label='Nodriza';if(!objective)objective='Rumbo a la nodriza';}
  ui.objtxt.textContent=objective;
  ui.prog.style.visibility=prog>=0?'visible':'hidden';ui.progfill.style.width=(clamp(prog,0,1)*100)+'%';
  return {target,label};
}

const _v=new THREE.Vector3();
function updateCamera(dt,t){
  const speed=Math.hypot(S.vx,S.vz);
  const H=78+speed*1.9;
  const lx=S.x+S.vx*.9,lz=S.z+S.vz*.9;
  const k=1-Math.exp(-dt*3.2);
  camLook.x=lerp(camLook.x,lx,k);camLook.z=lerp(camLook.z,lz,k);
  camPos.x=camLook.x;camPos.z=camLook.z+H*.42;camPos.y=lerp(camPos.y,H,1-Math.exp(-dt*1.5));
  let sx=0,sz=0;if(S.shake>0){sx=(Math.random()-.5)*S.shake*2.2;sz=(Math.random()-.5)*S.shake*2.2;S.shake=Math.max(0,S.shake-dt*2.5);}
  camera.position.set(camPos.x+sx,camPos.y,camPos.z+sz);
  camera.lookAt(camLook.x+sx*.5,0,camLook.z+sz*.5);
}
function updatePointer(target,label){
  if(!target||S.mode!=='play'||Math.hypot(target.x-S.x,target.z-S.z)<22){ui.ptr.style.display='none';return;}
  ui.ptr.style.display='flex';
  _v.set(target.x,1,target.z).project(camera);
  const W=innerWidth,H=innerHeight,m=60;
  let sx=(_v.x*.5+.5)*W,sy=(-_v.y*.5+.5)*H;

  const onScreen=_v.z<1&&sx>m&&sx<W-m&&sy>m+40&&sy<H-m-60;
  if(onScreen){
    ui.ptrarrow.style.transform='rotate(180deg)';
    ui.ptr.style.left=sx+'px';ui.ptr.style.top=(sy-34)+'px';
    ui.ptr.style.flexDirection='column-reverse';
  }else{
    const cx=W/2,cy=H/2;let dx=sx-cx,dy=sy-cy;if(_v.z>1){dx=-dx;dy=-dy;}
    const s=Math.min((W/2-m)/Math.abs(dx||1e-3),(H/2-m-40)/Math.abs(dy||1e-3));

  }

  lightsW.portLight.intensity=24*L;
  rockFoam.mesh.material.opacity=.45+.15*Math.sin(T*2.2);
  // reflejos en el agua
  const LP=waterU.uLP.value,LC=waterU.uLC.value,cz0=coastZ(PORT_X);

  const sigOn=S.drop&&S.drop.signal.material.opacity>.5;
  setL(4,S.drop?S.drop.landX:0,S.drop?S.drop.landZ+10:0,16,sigOn?.8:0,0xfff0d0);
  setL(5,patrol.x,patrol.z,22,patrol.state==='chase'&&Math.sin(T*14)>0?.7:0,0x3a7bff);
  buoys.forEach((b,i)=>{const on=((T+b.ph)%2.4)<.5;b.gl.material.opacity=on?1:0;setL(6+i,b.b.position.x,b.b.position.z,9,on?.8:0,b.col);});
  lightsW.signal.intensity=sigOn?45:0;if(S.drop)lightsW.signal.position.set(S.drop.landX,S.drop.landY+3,S.drop.landZ+2);
  moored.forEach(b=>{b.position.y=waveY(b.position.x,b.position.z,T)+.05;b.rotation.z=Math.sin(T*1.1+b.userData.ph)*.04;});
  // máscara de agua bajo los cascos

  waterU.uM.value[1].set(patrol.x,patrol.z,Math.sin(patrol.h),Math.cos(patrol.h));

  // barco: sigue la misma ola que el agua, más cabeceo y escora propios
  const speed=Math.hypot(S.vx,S.vz),u=S.u||0;
  const fx0=Math.sin(S.h),fz0=Math.cos(S.h);
  const wc=waveY(S.x,S.z,T),wb=waveY(S.x+fx0*5,S.z+fz0*5,T),ws=waveY(S.x-fx0*5,S.z-fz0*5,T);
  const wl=waveY(S.x+fz0*1.3,S.z-fx0*1.3,T),wr=waveY(S.x-fz0*1.3,S.z+fx0*1.3,T);
  const pitch=-(.085*smooth(2,11,u)-.035*smooth(12,20,u))-clamp(S.au||0,-6,6)*.006-(wb-ws)/10*(1-smooth(6,14,u)*.6);
  const roll=clamp(-S.om*.16*smooth(0,10,Math.abs(u)),-.22,.22)+(wl-wr)/2.6*.5;
  boat.group.position.set(S.x,wc+.14+.12*smooth(5,15,u),S.z);
  boat.group.rotation.set(pitch,S.h,roll);
  boat.engines.forEach(e=>e.rotation.y=S.rud*.42);
  boat.props.forEach(p=>p.rotation.z+=(S.thr*30+Math.hypot(S.vx,S.vz)*.5)*dt);
  boat.wheel.rotation.z=-S.rud*1.6;boat.levers.forEach(l=>l.rotation.x=-S.thr*.6);
  boat.captain.rotation.z=-roll*.6;boat.mate.rotation.z=-roll*.8;

  // estela
  if(speed>.6){
    const fx=Math.sin(S.h),fz=Math.cos(S.h),lxx=Math.cos(S.h),lxz=-Math.sin(S.h);
    const rate=speed*1.6*dt+Math.abs(S.thr)*.4;
    const n=Math.floor(rate+Math.random());
    for(let i=0;i<n;i++)for(const sd of [-1,1]){
      const ex=S.x-fx*6.4+lxx*sd*1,ez=S.z-fz*6.4+lxz*sd*1;
      emit(ex,ez,-fx*1.5+lxx*sd*1.2+S.vx*.15,-fz*1.5+lxz*sd*1.2+S.vz*.15,1.1,1.8+speed*.06,2.4+Math.random(),.32*Math.min(1,speed/7));
    }
    if(speed>9&&Math.random()<.9){for(const sd of [-1,1]){const bx=S.x+fx*3+lxx*sd*1.5,bz=S.z+fz*3+lxz*sd*1.5;
      emit(bx,bz,lxx*sd*5+S.vx*.3,lxz*sd*5+S.vz*.3,.7,2.5,.7,.45);}}
    if(Math.abs(S.w)>2.5&&Math.random()<.8){const sd=Math.sign(S.w);const bx=S.x+(-Math.cos(S.h))*sd*1.6,bz=S.z+Math.sin(S.h)*sd*1.6;
      emit(bx,bz,S.vx*.2,S.vz*.2,1.6,3,1.1,.4);}
  }
  updateParts(dt);
  updateFlying(dt);
  for(let i=sinking.length-1;i>=0;i--){const s=sinking[i];s.t+=dt;s.m.position.x+=s.vx*dt;s.m.position.z+=s.vz*dt;s.m.position.y=.3-s.t*.5;s.m.rotation.x+=dt;if(s.t>3){scene.remove(s.m);sinking.splice(i,1);}}

  // señales y zonas
  for(const d of DROPS){
    const active=S.drop===d&&playing;
    const ph=(T%2.2);const on=active&&(ph<.15||(ph>.3&&ph<.45)||(ph>.6&&ph<.75));
    d.signal.material.opacity=on?1:0;
    d.zone.material.opacity=.35+.3*Math.sin(T*4);
  }
  NOD.zone.visible=playing&&S.cargo<CFG.capacity&&S.stock>0;
  NOD.zone.material.opacity=.3+.25*Math.sin(T*3);
  lighthouse.beam.rotation.y=T*.6;
  drawMinimap(T);
  waterU.uTime.value=T;

  // audio
  if(AU&&!muted){
    const now=AU.ctx.currentTime,rpm=.2+Math.abs(S.thr)*.8+speed/45;
    AU.o1.frequency.setTargetAtTime(34+rpm*72,now,.06);AU.o2.frequency.setTargetAtTime(51+rpm*108,now,.06);
    AU.f.frequency.setTargetAtTime(220+rpm*900,now,.08);
    AU.g.gain.setTargetAtTime(playing?.035+Math.abs(S.thr)*.07:.015,now,.1);
    AU.ng.gain.setTargetAtTime(Math.min(.09,speed/18*.07),now,.1);AU.nf.frequency.setTargetAtTime(500+speed*40,now,.1);
    const chase=patrol.state==='chase'&&playing;
    AU.sg.gain.setTargetAtTime(chase?.03:0,now,.1);
    MUS.target=!playing?.25:chase?1:S.risk>.3?.65:.4;musicTick();AU.so.frequency.setTargetAtTime(Math.sin(T*5)>0?760:560,now,.02);
  }

  updateCamera(dt,T);
  updateHUD();
  ui.hud.style.visibility=S.mode==='menu'?'hidden':'';
  updatePointer(tgt.target,tgt.label);
  if(msgT>0){msgT-=dt;if(msgT<=0)ui.msg.classList.remove('show');}
  if(radioT>0){radioT-=dt;if(radioT<=0)ui.radio.classList.remove('show');}
  if(shoutT>0){shoutT-=dt;if(shoutT<=0)document.getElementById('shout').classList.remove('show');}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
frame();

addEventListener('resize',()=>{buildMinimap();camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
