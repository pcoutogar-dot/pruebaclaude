<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f3e5d3" />
  <title>Breakfast Simulator</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" />
</head>
<body data-mood="golden">
  <div id="app"></div>
  <div id="vignette"></div>

  <!-- arriba: solo la hora y la nevera -->
  <header id="hud">
    <div class="badge clock"><i>⏰</i><b id="time">07:30</b></div>
    <button id="homeBtn" class="badge back" hidden>‹ Mesa</button>
    <span class="grow"></span>
    <div class="seg" id="mood">
      <button data-mood="cutre" aria-label="Piso compartido">🏚️</button>
      <button data-mood="golden" class="on" aria-label="Mañana dorada">🌅</button>
    </div>
    <button class="badge coins" id="fridgeBtn" aria-label="Abrir la nevera"><i>🧊</i><b><span data-coins>30</span> 🪙</b></button>
  </header>

  <div id="msg"></div>
  <div id="ghost" aria-hidden="true">👆<small id="ghostTxt"></small></div>
  <div id="hub"></div>
  <div id="holdRing" aria-hidden="true"></div>
  <div id="spin" aria-hidden="true"><i>↻</i></div>

  <!-- abajo: mascota con pista, botones pequeños y la fila de herramientas -->
  <footer id="bottom">
    <div class="side">
      <button id="tosti" class="tosti" aria-label="Ver la pista"><i></i></button>
      <div id="bubble"><span id="steps"></span><span id="hint"></span></div>
      <span class="grow"></span>
      <div id="menu">
        <button id="sound" class="round" aria-label="Sonido">♪</button>
        <button id="reset" class="round" aria-label="Empezar de nuevo">↺</button>
      </div>
      <button id="photoBtn" class="round" aria-label="Hacer una foto">📷</button>
      <button id="more" class="round" aria-label="Más opciones">⋯</button>
      <button id="undo" class="round" aria-label="Deshacer">↶</button>
    </div>
    <div class="tools" id="tools"></div>
    <button id="work" class="big">💼 Ir a trabajar</button>
  </footer>

  <div id="shop" class="sheet">
    <div class="sheet-card">
      <header><b>Tu nevera</b><span class="badge coins"><b><span data-coins>30</span> 🪙</b></span><button id="shopClose" class="round" aria-label="Cerrar">✕</button></header>
      <nav class="tabs" id="shopTabs"></nav>
      <div class="grid" id="shopGrid"></div>
    </div>
  </div>

  <!-- modo foto -->
  <div id="photoUI">
    <div id="photoFrame"></div>
    <p id="photoTip">Mueve con un dedo · pellizca para acercar</p>
    <div class="photoBar">
      <button id="photoClose" class="round" aria-label="Salir del modo foto">✕</button>
      <button id="photoAngle" class="badge">📐 Desde arriba</button>
      <button id="photoShot" aria-label="Hacer la foto"></button>
      <button id="photoFilter" class="badge">🎨 Natural</button>
    </div>
  </div>
  <div id="photoResult">
    <div class="polaroid"><img id="photoImg" alt="Tu desayuno" /></div>
    <div class="photoActions">
      <button id="photoShare" class="big">Compartir 💌</button>
      <button id="photoAgain" class="badge">Otra foto</button>
    </div>
    <p id="photoHelp"></p>
  </div>
  <div id="flash"></div>

  <div id="fade"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
